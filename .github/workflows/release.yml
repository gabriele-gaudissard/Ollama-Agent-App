name: Test and publish Veyq
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py veyq
      - run: node --check app.js
      - run: npm ci --no-audit --no-fund
      - run: npm test

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'cryptography>=46,<49'
      - run: python scripts/build_release.py release
        env:
          VEYQ_RELEASE_SIGNING_KEY: ${{ secrets.VEYQ_RELEASE_SIGNING_KEY }}
      - name: Publish verified app update
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${BUILD_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/veyq-update.zip release/veyq-update.json --clobber
          else
            gh release create "$tag" release/veyq-update.zip release/veyq-update.json --target "$BUILD_SHA" --title "Veyq 4.0 · ${BUILD_SHA:0:7}" --notes "Automatic build after passing Windows tests. Download veyq-update.zip, extract it and run Installer.bat. Existing managed installations update automatically." --latest
          fi
